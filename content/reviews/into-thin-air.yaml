title: "Into Thin Air"
type: "Book"
author: "Jon Krakauer"
rating: 3
releaseYear: 1997
reviewDate: "2026-03-30T21:10:58.435Z"
text:
  - |
    Worth reading, especially for the part about how the tragedy itself unfolded, and the author reckoning with their part in it. I was speed reading a little bit at times though
  - |
    I didn't find the climbers really relatable for some reason - one of the reasons I liked the film Everest that was based on this is that it felt weirdly relatable, even though I've never been anywhere near that high the way the characters talked and carried themselves just felt very familiar, in a way that it didn't in the book
  - |
    I got a bit frustrated with the writing at times, it was sometimes a bit flowery, lots of places where the thesaurus was used to pick a fancy word instead of a simpler one, but for me that just made it harder to read, and also made it feel less personal
  - |
    Some of the historical diversions also didn't quite work for me. The author was trying to weave in the whole history of climbing Everest but some of these side quests felt a bit unnecessary and introduced many more names to try and remember
  - |
    I found it hard to actually picture the terrain and the conditions from the book, I ended up looking up some videos on YouTube instead
