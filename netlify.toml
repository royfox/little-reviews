[build]
  command = "npm run build"
  publish = "dist"

# Preserve recall.royfox.co.uk while the Cloudflare Worker remains the
# application origin. This forced rewrite proxies pages, assets, and API calls.
[[redirects]]
  from = "/*"
  to = "https://recall.roysfox-5b8.workers.dev/:splat"
  status = 200
  force = true
