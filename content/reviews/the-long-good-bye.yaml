title: "The Long Good-bye"
type: "Book"
author: "Raymond Chandler"
rating: 4.5
releaseYear: 1953
reviewDate: "2026-04-12T07:03:18.000Z"
text:
  - |
    A very well revealed mystery, there are enough clues that you guess some of it, but probably not all of it (you don't want everything to be so obvious so there's no mystery left, but you don't want it to feel like it was unguessable either).
  - |
    "Off to my left there was an empty swimming-pool, and nothing ever looks emptier than an empty swimming-pool."
  - |
    "Just like a cop. They never tell you why they are doing anything. That way you don’t find out they don’t know themselves."
  - |
    "‘Big Willie Magoon,’ he said thickly. ‘A vice squad bimbo. He thinks he’s tough.’ ‘You mean he isn’t sure?’ I asked him politely. He looked at me emptily and walked away. I got my car out of the lot and drove home. In Hollywood anything can happen, anything at all."
